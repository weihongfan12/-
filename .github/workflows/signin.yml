yaml                                                                name: 无限云盘每日签到                                          
    on:
      schedule:                                                             # GitHub Actions 使用 UTC                                           # 每天北京时间 09:00 = UTC 01:00                                    - cron: "0 1 * * *"                                               workflow_dispatch:

    permissions:                                                          contents: read                                                                                                                        jobs:                                                                 signin:                                                               runs-on: ubuntu-latest                                              timeout-minutes: 5                                                                                                                      steps:                                                                - name: Checkout                                                      uses: actions/checkout@v4                                                                                                             - name: Run sign-in                                                   env:                                                                  XB_ACCOUNT: ${{ secrets.XB_ACCOUNT }}                               XB_PASSWORD: ${{ secrets.XB_PASSWORD }}                           run: |                                                                set +e
              python3 signin.py | tee result.txt
              status=${PIPESTATUS[0]}
              exit "$status"

          - name: Send result to Telegram
            if: always()
            env:
              TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
              TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
            run: |
              test -n "$TELEGRAM_BOT_TOKEN"
              test -n "$TELEGRAM_CHAT_ID"

              python3 - <<'PY'
              import json
              import os
              import urllib.parse
              import urllib.request

              text = open("result.txt",
    encoding="utf-8").read().strip()

              url = (
                  "https://api.telegram.org/bot"
                  + os.environ["TELEGRAM_BOT_TOKEN"]
                  + "/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": text,
              }).encode()

              request = urllib.request.Request(
                  url,
                  data=data,
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=30) as
    response:
                  result = json.loads(response.read().decode())

              if not result.get("ok"):
                  raise SystemExit("Telegram 发送失败：" + str(result))

              print("Telegram notification sent")
              PY


